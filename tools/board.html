<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMAND BOARD</title>
  <link rel="stylesheet" href="./board.css">
</head>
<body>
  <div class="board-app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Personal Development Console</p>
        <h1>COMMAND BOARD</h1>
      </div>
      <div class="save-indicator" id="save-indicator" aria-live="polite">Saved</div>
    </header>

    <section class="composer-panel" aria-label="カード追加と管理">
      <form id="card-form" class="composer-form">
        <label class="field field-grow">
          <span>新しいカード</span>
          <textarea
            id="card-text"
            name="cardText"
            rows="3"
            maxlength="200"
            placeholder="やること、メモ、確認したいことを書いてください"
            required
          ></textarea>
        </label>

        <label class="field">
          <span>追加先</span>
          <select id="card-column" name="cardColumn"></select>
        </label>

        <button type="submit" class="action-button action-button-primary">ADD CARD</button>
      </form>

      <div class="tool-row" aria-label="ボード操作">
        <button type="button" class="action-button" id="seed-button">初期カードを追加</button>
        <button type="button" class="action-button" id="export-button">Export</button>
        <button type="button" class="action-button" id="import-button">Import</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>

      <p class="message-strip" id="message-strip" aria-live="polite" hidden></p>
    </section>

    <main class="board-shell">
      <section id="board-columns" class="board-columns" aria-label="タスクボード"></section>
    </main>
  </div>

  <template id="card-template">
    <article class="task-card" draggable="true">
      <div class="card-glow"></div>
      <button type="button" class="edit-button" aria-label="カードを編集">EDIT</button>
      <p class="card-text"></p>
      <button type="button" class="delete-button" aria-label="カードを削除">×</button>
    </article>
  </template>

  <dialog class="edit-dialog" id="edit-dialog">
    <form class="edit-form" id="edit-form" method="dialog">
      <div class="edit-form-header">
        <p class="edit-eyebrow">Card Editor</p>
        <h2 class="edit-title">EDIT CARD</h2>
      </div>

      <label class="field">
        <span>本文</span>
        <textarea
          id="edit-text"
          name="editText"
          rows="5"
          maxlength="200"
          placeholder="カード本文を入力"
          required
        ></textarea>
      </label>

      <div class="edit-actions">
        <button type="button" class="action-button" id="edit-cancel">Cancel</button>
        <button type="submit" class="action-button action-button-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="./board.js"></script>
</body>
</html>
