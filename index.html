<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>派遣勇者</title>
  <style>
    :root{--bg-deep:#0b0705;--bg:#14100c;--surface:#1f1711;--surface-2:#2a2118;--border:#4a3827;--border-bright:#8a6a3d;--text:#eee3cf;--muted:#9b8b73;--accent:#d6a84f;--accent-dim:#a9792b;--success:#9fce7a;--danger:#c9463e;--gold:#e0b45c;--radius:10px}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(214,168,79,.09),transparent),linear-gradient(180deg,var(--bg-deep),var(--bg) 42%,#100b08);color:var(--text);line-height:1.5}.wrap{max-width:760px;margin:0 auto;padding:1.25rem 1rem 2rem}.title-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.15rem;padding-bottom:.65rem;border-bottom:1px solid var(--border)}.title-row h1{margin:0;font-size:1.35rem;letter-spacing:.04em;color:var(--accent)}.subtitle{color:var(--muted);font-size:.8rem;margin-bottom:1rem;letter-spacing:.02em}.world-situation{min-height:3.1em;padding-left:.7rem;border-left:2px solid rgba(214,168,79,.38);opacity:1;transition:opacity .45s}.world-situation.fading{opacity:0}.world-situation span{display:block;margin:.08rem 0}.neon-card{background:var(--surface);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.75rem;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.35)}.neon-card>h2,.toolbar h2{margin:0 0 .65rem;font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}.toolbar h2{margin:0}.save-hint{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}.parties,.dual-panels,.log-columns{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}@media(max-width:600px){.parties,.dual-panels,.log-columns{grid-template-columns:1fr}}.party-card,.sub-panel,.log-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:.85rem}.party-card.on-mission-card{border-color:rgba(248,113,113,.75);background:linear-gradient(180deg,rgba(201,70,62,.11),rgba(42,33,24,.96)),var(--surface-2);animation:dangerPulse 1.9s ease-in-out infinite}@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 rgba(248,113,113,0),inset 0 0 0 rgba(248,113,113,0)}50%{box-shadow:0 0 24px rgba(248,113,113,.34),inset 0 0 18px rgba(248,113,113,.12)}}.log-panel{padding:.75rem;background:linear-gradient(180deg,rgba(214,168,79,.08),rgba(42,33,24,.96)),var(--surface-2)}.party-card h3,.sub-panel h3,.log-panel h3{margin:0 0 .5rem;font-size:.88rem;font-weight:600}.row{display:flex;justify-content:space-between;gap:.5rem;font-size:.86rem;margin-bottom:.25rem}.muted{color:var(--muted)}.status-idle{color:var(--success);font-weight:600}.status-mission{color:var(--accent);font-weight:600}.eta{margin:.45rem 0;font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--accent)}.field-label{display:block;margin:.45rem 0 .25rem;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.area-select{width:100%;padding:.5rem .55rem;font-size:.86rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}.area-select:focus{outline:none;border-color:var(--accent-dim)}.area-select:disabled{opacity:.45}.dispatch-wrap{margin-top:.55rem}button.primary{position:relative;width:100%;padding:.65rem;overflow:hidden;border:1px solid var(--accent-dim);border-radius:6px;font-size:.9rem;font-weight:600;letter-spacing:.03em;cursor:pointer;color:#120c07;background:linear-gradient(180deg,#f1d18a,var(--accent) 50%,var(--accent-dim));box-shadow:0 2px 12px rgba(214,168,79,.16)}button.primary:hover:not(:disabled){filter:brightness(1.08)}button.primary.on-mission{color:var(--accent);background:var(--bg);border-color:var(--border-bright);box-shadow:none;cursor:default}button.primary:disabled.on-mission{opacity:1}.btn-progress{position:absolute;left:0;top:0;bottom:0;z-index:0;width:0%;border-radius:5px;background:linear-gradient(90deg,rgba(214,168,79,.24),rgba(214,168,79,.5));transition:width .15s linear}.btn-label{position:relative;z-index:1}button.ghost{padding:.4rem .75rem;border:1px solid var(--border);border-radius:6px;background:transparent;font-size:.78rem;color:var(--muted);cursor:pointer}button.ghost:hover{border-color:var(--danger);color:var(--danger);background:rgba(201,70,62,.08)}.report{margin:0;min-height:3em;font-size:.84rem}.report strong{color:var(--accent)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;font-size:.82rem}.stat-cell{padding:.45rem .5rem;border:1px solid var(--border);border-radius:6px;background:var(--bg)}.stat-cell .label{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.dispatch-log{max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}.dispatch-group{margin-bottom:.45rem;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)}.dispatch-head{width:100%;padding:.5rem .65rem;border:none;background:var(--surface-2);font-family:inherit;font-size:.76rem;font-weight:600;text-align:left;color:var(--text);cursor:pointer}.dispatch-head:hover{background:#35281c}.dispatch-head .sub{font-weight:400;color:var(--muted);font-size:.7rem}.dispatch-body{padding:0 .4rem .3rem}.dispatch-group.collapsed .dispatch-body{display:none}.adventure-log{margin:0;padding:.15rem .25rem;list-style:none;border:1px solid rgba(116,78,43,.58);border-radius:6px;background:linear-gradient(rgba(214,168,79,.025) 50%,transparent 50%),rgba(25,16,10,.42);background-size:100% 2.2rem;font-family:"Yu Mincho","Hiragino Mincho ProN","Times New Roman",serif;letter-spacing:.055em;line-height:1.75}.adventure-log li{border-bottom:1px solid rgba(116,78,43,.38)}.adventure-log li:last-child{border-bottom:none}.log-entry{width:100%;padding:.52rem .2rem;border:none;background:transparent;font-family:inherit;font-size:.78rem;letter-spacing:inherit;line-height:inherit;text-align:left;color:#e1d2b6}.log-entry.flavor{color:var(--muted)}.log-entry.battle{font-weight:500;color:#ead7b5}.log-entry.clickable{cursor:pointer}.log-entry.clickable:hover{background:rgba(214,168,79,.08)}.log-entry .time{display:block;margin-bottom:.08rem;font-size:.64rem;font-variant-numeric:tabular-nums;color:#7b684d}.rare-tag,.boss-tag{font-size:.6rem;margin-left:.25rem;padding:.06rem .35rem;border-radius:3px}.rare-tag{border:1px solid rgba(160,48,42,.52);background:rgba(160,48,42,.18);color:var(--gold)}.boss-tag{border:1px solid rgba(201,70,62,.75);background:rgba(201,70,62,.24);color:#ffd5b2}.battle-detail{display:none;margin:0 0 .5rem .3rem;padding-left:.65rem;border-left:2px solid rgba(116,78,43,.72);font-size:.74rem;letter-spacing:.045em;line-height:1.75;color:#b9a789}.battle-detail.open{display:block}.battle-detail p{margin:.1rem 0}.battle-detail .enemy{color:var(--danger)}.battle-detail .kill{color:var(--success)}.battle-detail .xp{color:var(--accent)}.battle-detail .gold{color:var(--gold)}.battle-detail .boss{color:#ffd5b2;font-weight:600}.log-empty{padding:.35rem .2rem;font-size:.78rem;color:var(--muted)}.stage-list{display:flex;flex-wrap:wrap;gap:.4rem}.stage-chip{padding:.35rem .55rem;border-radius:6px;font-size:.72rem;border:1px solid var(--border);background:var(--bg);color:var(--muted)}.stage-chip.unlocked{border-color:var(--border-bright);color:var(--text)}.stage-chip.cleared{border-color:rgba(159,206,122,.4);color:var(--success)}.stage-chip.locked::after{content:" 🔒";font-size:.65rem}.current-dispatch-label{margin:0 0 .4rem;font-size:.76rem;font-weight:600;color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title-row"><h1>派遣勇者</h1><button type="button" class="ghost" id="reset-btn">リセット</button></div>
    <div class="subtitle world-situation" id="world-situation" aria-live="polite"></div>
    <div class="neon-card"><div class="toolbar"><h2>パーティ</h2><span class="save-hint" id="save-hint">自動保存</span></div><div class="parties" id="parties-root"></div></div>
    <div class="neon-card"><h2>直近の帰還</h2><div class="dual-panels" id="reports-root"></div></div>
    <div class="neon-card"><h2>冒険ログ</h2><div class="log-columns"><div class="log-panel"><h3>第1パーティ</h3><div class="dispatch-log" id="log-pt1"></div></div><div class="log-panel"><h3>第2パーティ</h3><div class="dispatch-log" id="log-pt2"></div></div></div></div>
    <div class="neon-card"><h2>過去の派遣</h2><div class="log-columns"><div class="log-panel"><h3>第1パーティ</h3><div class="dispatch-log" id="past-pt1"></div></div><div class="log-panel"><h3>第2パーティ</h3><div class="dispatch-log" id="past-pt2"></div></div></div></div>
    <div class="neon-card"><h2>ステージ解放</h2><div id="stages-root" class="stage-list"></div></div>
    <div class="neon-card"><h2>累計</h2><div class="dual-panels" id="stats-root"></div></div>
  </div>
  <script>
    const SAVE_KEY="dispatch-hero-save-v7";
    const MAX_DISPATCH_HISTORY=5;
    const AREA_ORDER=["plain","forest","swamp","ruins","canyon","glacier","volcano","abyss"];
    const AREAS={plain:{id:"plain",name:"平原",baseAtk:4,durationMs:10000,goldMult:1,unlockAfter:null},forest:{id:"forest",name:"森",baseAtk:7,durationMs:10000,goldMult:1.35,unlockAfter:"plain"},swamp:{id:"swamp",name:"沼",baseAtk:11,durationMs:10000,goldMult:1.7,unlockAfter:"forest"},ruins:{id:"ruins",name:"遺跡",baseAtk:14,durationMs:10000,goldMult:2,unlockAfter:"swamp"},canyon:{id:"canyon",name:"峡谷",baseAtk:17,durationMs:10000,goldMult:2.3,unlockAfter:"ruins"},glacier:{id:"glacier",name:"氷原",baseAtk:20,durationMs:10000,goldMult:2.6,unlockAfter:"canyon"},volcano:{id:"volcano",name:"火山",baseAtk:24,durationMs:10000,goldMult:3,unlockAfter:"glacier"},abyss:{id:"abyss",name:"深淵",baseAtk:28,durationMs:10000,goldMult:3.5,unlockAfter:"volcano"}};
    const MONSTERS={plain:[{name:"スライム",weight:38,atkMod:0},{name:"飢えた野犬",weight:28,atkMod:-1},{name:"黒羽の小鬼",weight:22,atkMod:1},{name:"角兎の群れ",weight:8,atkMod:2,rare:true}],forest:[{name:"森ゴブリン",weight:36,atkMod:0},{name:"月吠え狼",weight:26,atkMod:1},{name:"樹皮の人形",weight:20,atkMod:1},{name:"梢に潜む狩人",weight:5,atkMod:5,rare:true}],swamp:[{name:"沼棲スライム",weight:34,atkMod:0},{name:"毒ガエル",weight:26,atkMod:1},{name:"泥人形",weight:22,atkMod:2},{name:"沈んだ巡礼者",weight:3,atkMod:6,rare:true}],ruins:[{name:"骸骨兵",weight:35,atkMod:0},{name:"呪われた鎧",weight:25,atkMod:1},{name:"墓守",weight:22,atkMod:2},{name:"リッチの影",weight:4,atkMod:6,rare:true}],canyon:[{name:"崖羽のハーピー",weight:34,atkMod:0},{name:"岩蛇",weight:26,atkMod:1},{name:"谷底の盗賊団",weight:22,atkMod:2},{name:"峡谷の竜影",weight:3,atkMod:7,rare:true}],glacier:[{name:"氷狼",weight:36,atkMod:0},{name:"フロストバット",weight:26,atkMod:1},{name:"雪怪",weight:20,atkMod:2},{name:"白銀の猛獣",weight:4,atkMod:7,rare:true}],volcano:[{name:"火蜥蜴",weight:35,atkMod:0},{name:"溶岩ゴーレム",weight:26,atkMod:2},{name:"炎魔",weight:20,atkMod:2},{name:"紅蓮の翼",weight:9,atkMod:5,rare:true}],abyss:[{name:"深淵の触手",weight:34,atkMod:1},{name:"虚無の影",weight:26,atkMod:2},{name:"堕天使の欠片",weight:20,atkMod:3},{name:"時空の亡霊",weight:9,atkMod:6,rare:true}]};
    const BOSSES={plain:{name:"変異種スライム",atkMod:7,goldMult:2.2,xpMult:2.1,omen:["……草原の匂いが腐り、空気がぬるく沈んだ。","踏み荒らされた草の中心で、粘つく影が脈打っている。"],entrance:"膨れ上がった変異種スライムが、骨を溶かす泡をまとって現れた。"},forest:{name:"森喰らい",atkMod:10,goldMult:2.35,xpMult:2.25,omen:["鳥の声が一斉に途絶え、幹の奥から重い咀嚼音が響いた。","木々の影が内側へ折れ、森そのものが息を止めた。"],entrance:"森喰らいが根と牙を引きずり、暗い樹液を滴らせて迫った。"},swamp:{name:"沼の大口",atkMod:13,goldMult:2.5,xpMult:2.35,omen:["水面の泡がこちらを囲み、沼の底から生温い吐息が上がった。","泥の下で、巨大な顎がゆっくり開く音がした。"],entrance:"沼の大口が黒い水を割り、祈りを飲み込むように牙を並べた。"},ruins:{name:"古代守護者",atkMod:16,goldMult:2.65,xpMult:2.5,omen:["壁の碑文が赤く灯り、誰もいない回廊に鎖の音が満ちた。","砂時計の砂が止まり、封印石が内側から砕けた。"],entrance:"古代守護者が石棺を押し開け、失われた王朝の命令を今も守っていた。"},canyon:{name:"赤峡の断頭翼",atkMod:18,goldMult:2.8,xpMult:2.6,omen:["谷底から熱い風が吹き上がり、吊り橋の影が首を落とす刃の形に伸びた。","岩壁を削る羽音が近づき、砂が赤く舞い上がった。"],entrance:"赤峡の断頭翼が崖を蹴り、錆びた鉤爪を広げて急降下した。"},glacier:{name:"霜葬の巨影",atkMod:21,goldMult:2.95,xpMult:2.75,omen:["吹雪の向こうで鐘が鳴り、足元の氷に古い顔が浮かんだ。","白い地平が割れ、凍った息が墓標のように立ち上がった。"],entrance:"霜葬の巨影が氷壁から剥がれ、沈黙したまま腕を振り下ろした。"},volcano:{name:"灼熱竜",atkMod:25,goldMult:3.1,xpMult:2.95,omen:["火口の奥から重い足音が響き、灰が逆巻いて空を閉ざした。","溶岩の筋が脈を打ち、焦げた翼の影が地面を覆った。"],entrance:"灼熱竜が噴煙を裂き、赤熱した鱗を鳴らして咆哮した。"},abyss:{name:"深淵の使者",atkMod:30,goldMult:3.35,xpMult:3.25,omen:["……空気が変わった。灯りの外側から、まだ起きていない戦闘の音がする。","影が本人より先に膝をつき、深淵の奥で誰かが名を呼んだ。"],entrance:"深淵の使者が闇の裂け目から現れ、帰還という言葉を静かに否定した。"}};
    const FLAVOR={plain:{depart:["{hero}が巡察印を受け取り、{area}へ向かった"],walk:["低い草が風に揺れ、街道標だけが静かに立っている"],rest:["古い道標の陰で水筒を傾けた"],sense:["草むらの奥で小さな気配が跳ねた"],mood:["遠くで農村の鐘が三度鳴った"],after:["討伐印を押すため、{hero}は帰路の街道へ戻った"]},forest:{depart:["{hero}は獣避けの鈴を受け取り、{area}の境界へ向かった"],walk:["枝葉が空を塞ぎ、昼でも薄暗い"],rest:["倒木の陰で息を潜め、周囲の音を数えた"],sense:["鳥の声が急に途切れた"],mood:["霧が幹の間を這うように流れた"],after:["{hero}は獣臭の染みた外套を払い、森を抜けた"]},swamp:{depart:["{hero}は防湿袋に依頼書を収め、{area}へ派遣された"],walk:["膝下の泥が重く、歩くたび泡が弾けた"],rest:["沈みかけた桟橋の上で、短く呼吸を整えた"],sense:["葦原の向こうで何かが水を掻いた"],mood:["霧が足元から立ち上がり、腰の高さで止まった"],after:["{hero}は泥に汚れた討伐証を包み、帰路へついた"]},ruins:{depart:["{hero}は封印調査の副本を受け取り、{area}へ向かった"],walk:["割れた石畳が、月のない回廊へ続いている"],rest:["崩れた祭壇の前で、燭台に火を移した"],sense:["空の回廊に、誰かの衣擦れが聞こえた"],mood:["燭火が風もないのに横へ流れた"],after:["{hero}は拓本と討伐証を筒に収め、遺跡を後にした"]},canyon:{depart:["{hero}は落石注意の赤札を受け取り、{area}へ向かった"],walk:["細い岩棚の下で、深い谷が口を開けている"],rest:["岩陰で水を一口含み、落石の音を待った"],sense:["風の唸りに混じり、羽ばたきが近づいた"],mood:["夕陽が崖を血の色に染めた"],after:["{hero}は砂を払って、峡谷監視所へ帰還を告げた"]},glacier:{depart:["{hero}は防寒符を受け取り、{area}へ派遣された"],walk:["雪面は硬く凍り、足音が鋭く割れた"],rest:["氷岩の陰で手を温め、凍った紐を解いた"],sense:["吹雪の向こうに黒い輪郭が立っていた"],mood:["遠くの氷塔が鐘のように鳴った"],after:["{hero}は凍った討伐証を胸元で温め、帰路についた"]},volcano:{depart:["{hero}は耐熱布に包んだ依頼書を受け取り、{area}へ向かった"],walk:["黒い斜面に火山灰が積もり、踏むたび熱を吐いた"],rest:["噴煙の切れ間で水を飲み、灰を吐き出した"],sense:["火口の奥から獣の咆哮に似た音が上がった"],mood:["火山弾が遠くで弾け、赤い飛沫を散らした"],after:["{hero}は灰を被った討伐証を包み、火口を離れた"]},abyss:{depart:["{hero}は封蝋された黒い依頼書を受け取り、{area}へ向かった"],walk:["道は下へ続いているはずなのに、足元の影が上へ伸びた"],rest:["壊れた時計の針を見つめ、呼吸の数を確かめた"],sense:["背後から自分の声で呼ばれた"],mood:["砂時計の砂が上へ落ちている"],after:["{hero}は時刻のずれた報告書を握り、深淵を後にした"]}};
    const WORLD_SITUATIONS={plain:[["最近、平原付近の魔物が活発化しているようだ。","近隣街道にて小規模な襲撃報告あり。"],["農村組合より、夜間の見回り強化を求める嘆願書が届いた。","被害は軽微だが、放置すべき兆候ではない。"]],forest:[["森から戻らない行商人が増えている。","夜間、森方面で遠吠えが確認された。"],["樹海の奥で灯りを見たという証言が相次いでいる。","森が以前より静かすぎる。"]],swamp:[["沼地で消息を絶つ冒険者が後を絶たない。","古い祭壇を見たという報告が複数ある。"]],ruins:[["遺跡内部で未知の紋章が発見された。","北方街道は現在も封鎖中。"]],canyon:[["峡谷監視所より、落石では説明できない崩落音の報告あり。","吊り橋の通行許可はギルド管理下へ移された。"]],glacier:[["氷原方面の監視旗が一夜で凍結した。","北風に混じり、鐘のような音が聞こえるとの報告あり。"]],volcano:[["火山灰が南の街道まで届き始めている。","鉱山組合は一時撤退を決定した。"]],abyss:[["深淵周辺で時間感覚異常が報告されている。","帰還した冒険者の証言に食い違いが見られる。"]]};
    const defaultStats=()=>({gold:0,kills:0,missionsStarted:0,missionsCleared:0});
    const defaultParty=(id,heroName)=>({id,name:id==="pt1"?"第1パーティ":"第2パーティ",hero:{name:heroName,level:1,xp:0,xpToNext:10},selectedArea:"plain",mission:null,stats:defaultStats(),lastReport:null,dispatches:[],expandedDispatchIds:[]});
    let state={parties:[defaultParty("pt1","アレン"),defaultParty("pt2","リナ")],areaClears:{}};
    let tickId=null,worldSituationTickId=null,worldSituationIndex=0,worldSituationTier="",nextId=1;
    const $=(id)=>document.getElementById(id),uid=(p)=>`${p}-${nextId++}`,randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=(arr)=>arr[randInt(0,arr.length-1)],fill=(tpl,v)=>tpl.replace(/\{(\w+)\}/g,(_,k)=>v[k]??"");
    function formatClock(ts){const d=new Date(ts);return[d.getHours(),d.getMinutes(),d.getSeconds()].map((n)=>String(n).padStart(2,"0")).join(":")}

    function buildScheduledJournal(party,area,rewards,startedAt,endsAt){const vars={hero:party.hero.name,area:area.name},flavor=FLAVOR[area.id]||FLAVOR.plain,boss=getBoss(area.id),duration=endsAt-startedAt,slots=[],normalEncounters=rewards.encounters.filter((enc)=>!enc.isBoss),bossEncounter=rewards.encounters.find((enc)=>enc.isBoss),addFlavor=(pool,min=.05,max=.7)=>slots.push({type:"flavor",ratio:min+Math.random()*(max-min),title:fill(pick(pool),vars)});addFlavor(flavor.depart,.02,.08);addFlavor(flavor.walk,.12,.24);if(Math.random()<.65)addFlavor(flavor.rest,.18,.52);if(Math.random()<.55)addFlavor(flavor.mood,.2,.58);if(Math.random()<.7)addFlavor(flavor.sense,.25,.62);normalEncounters.forEach((enc,index)=>{slots.push({type:"battle",ratio:Math.min(.66,.3+index*.1+Math.random()*.08),title:`${enc.monster.name}と遭遇した。`,battleDetail:enc.events,monsterRare:!!enc.monster.rare,isBoss:false});if(Math.random()<.35)addFlavor(flavor.sense,.36,.68)});slots.push({type:"flavor",ratio:.72,title:pick(boss.omen)});if(bossEncounter){slots.push({type:"battle",ratio:.82,title:`${bossEncounter.monster.name}が出現した。`,battleDetail:bossEncounter.events,monsterRare:true,isBoss:true})}if(Math.random()<.8)addFlavor(flavor.after,.9,.94);slots.sort((a,b)=>a.ratio-b.ratio);const journal=slots.map((slot)=>({id:uid("entry"),type:slot.type,timestamp:Math.floor(startedAt+duration*slot.ratio),title:slot.title,battleDetail:slot.battleDetail||null,monsterRare:slot.monsterRare||false,isBoss:slot.isBoss||false,shown:false}));journal.push({id:uid("entry"),type:"return",timestamp:endsAt,title:`${vars.hero}が${area.name}から帰還した（全戦闘記録▼）`,battleDetail:rewards.events,summary:`討伐${rewards.kills} / ${rewards.gold} G / ${rewards.xp} XP`,shown:false});return journal}
    function getActiveDispatch(party){return party.dispatches.find((d)=>d.status==="active")||null}function trimDispatches(party){if(party.dispatches.length<=MAX_DISPATCH_HISTORY)return;const removed=party.dispatches.splice(MAX_DISPATCH_HISTORY),removedIds=new Set(removed.map((d)=>d.id));party.expandedDispatchIds=(party.expandedDispatchIds||[]).filter((id)=>!removedIds.has(id))}

    function migrate(data){if(!data.parties)return data;for(const p of data.parties){if(!p.stats)p.stats=defaultStats();if(!p.dispatches)p.dispatches=[];if(!p.expandedDispatchIds)p.expandedDispatchIds=[];if(p.adventureLog?.length&&!p.dispatches.length){p.dispatches.push({id:uid("dispatch"),areaName:"過去の記録",startedAt:0,endsAt:0,status:"complete",entries:p.adventureLog,summary:"移行データ"});delete p.adventureLog}if(p.mission&&!p.mission.journal&&p.mission.rewards){const area=getArea(p.mission.areaId);p.mission.journal=buildScheduledJournal(p,area,p.mission.rewards,p.mission.startedAt,p.mission.endsAt);const d=p.dispatches.find((x)=>x.id===p.mission.dispatchId);if(d){for(const e of p.mission.journal){if(e.timestamp<=Date.now()){e.shown=true;d.entries.push({...e})}}}}}if(data.gold!=null&&data.parties[0]){const p0=data.parties[0].stats;p0.gold+=data.gold||0;p0.kills+=data.totalKills||0;p0.missionsStarted+=data.missionsStarted||0;p0.missionsCleared+=data.missionsCleared||0}if(!data.areaClears)data.areaClears={};if(Object.keys(data.areaClears).length===0){for(const p of data.parties){for(const d of p.dispatches||[]){if(d.status!=="complete")continue;const areaId=d.areaId||AREA_ORDER.find((id)=>AREAS[id].name===d.areaName)||"plain";d.areaId=areaId;data.areaClears[areaId]=(data.areaClears[areaId]||0)+1;let prev=AREAS[areaId]?.unlockAfter;while(prev){if(!data.areaClears[prev])data.areaClears[prev]=1;prev=AREAS[prev]?.unlockAfter}}}}return data}
