* { box-sizing: border-box; }

body {

  background:

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 1.25rem 1rem 2rem;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.15rem;
  padding-bottom: 0.65rem;
  border-bottom: 1px solid var(--border);
}

.title-row h1 {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent);
}

.subtitle {
  color: var(--muted);
  font-size: 0.8rem;
  margin-bottom: 1rem;
  letter-spacing: 0.02em;
}

.neon-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: 0.75rem;
  border: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
}

.neon-card > h2 {
  margin: 0 0 0.65rem;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}

.toolbar h2 {
  margin: 0;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

.save-hint {
  font-size: 0.72rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.parties, .dual-panels, .log-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
}

@media (max-width: 600px) {
  .parties, .dual-panels, .log-columns { grid-template-columns: 1fr; }
}

.party-card, .sub-panel, .log-panel {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem;
}

.party-card.on-mission-card {
  border-color: rgba(248, 113, 113, 0.75);
  background:
    linear-gradient(180deg, rgba(201, 70, 62, 0.11), rgba(42, 33, 24, 0.96)),
    var(--surface-2);
  animation: dangerPulse 1.9s ease-in-out infinite;
}

@keyframes dangerPulse {
  0%, 100% {
    box-shadow:
      0 0 0 rgba(248, 113, 113, 0),
      inset 0 0 0 rgba(248, 113, 113, 0);
  }
  50% {
    box-shadow:
      0 0 24px rgba(248, 113, 113, 0.34),
      inset 0 0 18px rgba(248, 113, 113, 0.12);
  }
}

.log-panel {
  padding: 0.75rem;
  background:
    linear-gradient(180deg, rgba(214, 168, 79, 0.08), rgba(42, 33, 24, 0.96)),
    var(--surface-2);
}

.party-card h3, .sub-panel h3, .log-panel h3 {
  margin: 0 0 0.5rem;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.86rem;
  margin-bottom: 0.25rem;
}

.muted { color: var(--muted); }
.status-idle { color: var(--success); font-weight: 600; }
.status-mission { color: var(--accent); font-weight: 600; }

.eta {
  margin: 0.45rem 0;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

.field-label {
  display: block;
  margin: 0.45rem 0 0.25rem;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.area-select {
  width: 100%;
  padding: 0.5rem 0.55rem;
  font-size: 0.86rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
}

.area-select:focus {
  outline: none;
  border-color: var(--accent-dim);
}

.area-select:disabled { opacity: 0.45; }
.dispatch-wrap { margin-top: 0.55rem; }

button.primary {
  position: relative;
  width: 100%;
  padding: 0.65rem;
  overflow: hidden;
  border: 1px solid var(--accent-dim);
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  cursor: pointer;
  color: #120c07;
  background: linear-gradient(180deg, #f1d18a 0%, var(--accent) 50%, var(--accent-dim) 100%);
  box-shadow: 0 2px 12px var(--accent-glow);
}

button.primary:hover:not(:disabled) {
  filter: brightness(1.08);
}

button.primary.on-mission {
  color: var(--accent);
  background: var(--bg);
  border-color: var(--border-bright);
  box-shadow: none;
  cursor: default;
}

button.primary:disabled.on-mission { opacity: 1; }

.btn-progress {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 0;
  width: 0%;
  border-radius: 5px;
  background: linear-gradient(90deg, rgba(214, 168, 79, 0.24), rgba(214, 168, 79, 0.5));
  transition: width 0.15s linear;
}

.btn-label { position: relative; z-index: 1; }

button.ghost {
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  font-size: 0.78rem;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

button.ghost:hover {
  border-color: var(--danger);
  color: var(--danger);
  background: rgba(201, 70, 62, 0.08);
}

.report { margin: 0; min-height: 3em; font-size: 0.84rem; }
.report strong { color: var(--accent); }

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem;
  font-size: 0.82rem;
}

.stat-cell {
  padding: 0.45rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
}

.stat-cell .label {
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.dispatch-log {
  max-height: 300px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.dispatch-group {
  margin-bottom: 0.45rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}

.dispatch-group.latest {
  border-color: var(--border-bright);
}

.dispatch-head {
  width: 100%;
  padding: 0.5rem 0.65rem;
  border: none;
  background: var(--surface-2);
  font-family: inherit;
  font-size: 0.76rem;
  font-weight: 600;
  text-align: left;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s;
}

.dispatch-head:hover { background: #35281c; }

.dispatch-group.latest .dispatch-head {
  background: linear-gradient(90deg, rgba(214, 168, 79, 0.14), transparent);
  color: var(--accent);
}

.dispatch-group.collapsed .dispatch-head { cursor: pointer; }
.dispatch-head .sub {
  font-weight: 400;
  color: var(--muted);
  font-size: 0.7rem;
}

.dispatch-body { padding: 0 0.4rem 0.3rem; }
.dispatch-group.collapsed .dispatch-body { display: none; }

.adventure-log {
  margin: 0;
  padding: 0.15rem 0.25rem;
  list-style: none;
  border: 1px solid rgba(116, 78, 43, 0.58);
  border-radius: 6px;
  background:
    linear-gradient(rgba(214, 168, 79, 0.025) 50%, transparent 50%),
    rgba(25, 16, 10, 0.42);
  background-size: 100% 2.2rem;
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "Times New Roman", serif;
  letter-spacing: 0.055em;
  line-height: 1.75;
}

.adventure-log li { border-bottom: 1px solid rgba(116, 78, 43, 0.38); }
.adventure-log li:last-child { border-bottom: none; }

.log-entry {
  width: 100%;
  padding: 0.52rem 0.2rem;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.78rem;
  letter-spacing: inherit;
  line-height: inherit;
  text-align: left;
  color: #e1d2b6;
}

.log-entry.flavor { color: var(--muted); }
.log-entry.battle { font-weight: 500; color: #ead7b5; }
.log-entry.clickable { cursor: pointer; }
.log-entry.clickable:hover { background: rgba(214, 168, 79, 0.08); }

.log-entry .time {
  display: block;
  margin-bottom: 0.08rem;
  font-size: 0.64rem;
  font-variant-numeric: tabular-nums;
  color: #7b684d;
}

.log-entry .rare-tag {
  font-size: 0.6rem;
  margin-left: 0.25rem;
  padding: 0.06rem 0.35rem;
  border-radius: 3px;
  border: 1px solid rgba(160, 48, 42, 0.52);
  background: rgba(160, 48, 42, 0.18);
  color: var(--gold);
}

.battle-detail {
  display: none;
  margin: 0 0 0.5rem 0.3rem;
  padding-left: 0.65rem;
  border-left: 2px solid rgba(116, 78, 43, 0.72);
  font-size: 0.74rem;
  letter-spacing: 0.045em;
  line-height: 1.75;
  color: #b9a789;
}

.battle-detail.open { display: block; }
.battle-detail p { margin: 0.1rem 0; }
.battle-detail .enemy { color: var(--danger); }
.battle-detail .kill { color: var(--success); }
.battle-detail .xp { color: var(--accent); }
.battle-detail .gold { color: var(--gold); }

.log-empty {
  padding: 0.35rem 0.2rem;
  font-size: 0.78rem;
  color: var(--muted);
}

.stage-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.stage-chip {
  padding: 0.35rem 0.55rem;
  border-radius: 6px;
  font-size: 0.72rem;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
}

.stage-chip.unlocked {
  border-color: var(--border-bright);
  color: var(--text);
}

.stage-chip.cleared {
  border-color: rgba(159, 206, 122, 0.4);
  color: var(--success);
}

.stage-chip.locked::after {
  content: " 🔒";
  font-size: 0.65rem;
}

.current-dispatch-label {
  margin: 0 0 0.4rem;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--accent);
}

, levelUps, }; } function missionProgress(party) { if (!party.mission) return 0; const { startedAt, endsAt } = party.mission; const total = endsAt - startedAt; return total <= 0 ? 100 : Math.min(100, Math.max(0, ((Date.now() - startedAt) / total) * 100)); } function startMission(partyId) { const party = getParty(partyId); if (!party || party.mission) return; ensureValidSelectedArea(party); if (!isAreaUnlocked(party.selectedArea)) return; const area = getArea(party.selectedArea); const rewards = generateBattle(area, party.hero.level); const now = Date.now(); const endsAt = now + area.durationMs; const dispatchId = uid("dispatch"); const dispatch = { id: dispatchId, areaId: area.id, areaName: area.name, startedAt: now, endsAt, status: "active", entries: [], }; party.dispatches.unshift(dispatch); trimDispatches(party); party.mission = { dispatchId, areaId: area.id, startedAt: now, endsAt, rewards, journal: buildScheduledJournal(party, area, rewards, now, endsAt), }; party.stats.missionsStarted += 1; revealDueEntries(party); saveGame(); renderParties(); renderReports(); renderCurrentDispatchLog(party); renderPastDispatchLog(party); ensureTick(); } function completeMission(party) { if (!party.mission) return; const area = getArea(party.mission.areaId); const dispatch = party.dispatches.find((d) => d.id === party.mission.dispatchId); revealDueEntries(party); if (dispatch) { dispatch.status = "complete"; dispatch.endsAt = party.mission.endsAt; dispatch.summary = party.mission.journal.find((e) => e.type === "return")?.summary; } recordAreaClear(area.id); applyRewards(party, area, party.mission.rewards); party.mission = null; saveGame(); renderParties(); renderReports(); renderStats(); renderStages(); renderCurrentDispatchLog(party); renderPastDispatchLog(party); } function processMissions() { let logDirty = false; for (const party of state.parties) { if (!party.mission) continue; if (revealDueEntries(party)) logDirty = true; if (Date.now() >= party.mission.endsAt) { completeMission(party); } else { logDirty = true; } } updateProgressBars(); if (logDirty) { state.parties.forEach((p) => { renderCurrentDispatchLog(p); renderPastDispatchLog(p); }); } if (!state.parties.some((p) => p.mission)) stopTick(); } function updateProgressBars() { document.querySelectorAll("[data-progress]").forEach((wrap) => { const party = getParty(wrap.dataset.progress); const bar = wrap.querySelector(".btn-progress"); if (party?.mission && bar) bar.style.width = `${missionProgress(party)}%`; }); } function currentDispatchLabel(dispatch) { if (dispatch.status === "active") return `いまの派遣（${dispatch.areaName}）`; return `直近の派遣（${dispatch.areaName}）`; } function pastDispatchLabel(pastIndex, dispatch) { return `${pastIndex}回前の派遣（${dispatch.areaName}）`; } function entryButtonHtml(entry, open) { const rare = entry.monsterRare ? '<span class="rare-tag">レア</span>' : ""; let title = entry.title; if (entry.type === "return") { title = title.replace(/（全戦闘記録[▼▲]）$/, ""); title += open ? "（全戦闘記録▲）" : "（全戦闘記録▼）"; } else if (entry.battleDetail?.length) { title += open ? " ▲" : " ▼"; } return `<span class="time">${formatClock(entry.timestamp)}</span>${title}${rare}`; } function renderLogEntry(entry) { const hasBattle = entry.battleDetail?.length > 0; const li = document.createElement("li"); const btn = document.createElement("button"); btn.type = "button"; btn.className = "log-entry" + (entry.type === "flavor" ? " flavor" : "") + (entry.type === "battle" ? " battle" : "") + (hasBattle ? " clickable" : ""); btn.innerHTML = entryButtonHtml(entry, false); li.appendChild(btn); if (hasBattle) { const detail = document.createElement("div"); detail.className = "battle-detail"; detail.innerHTML = entry.battleDetail .map((ev) => { const c = ev.kind || ""; return `<p class="${c}">${ev.text}</p>`; }) .join(""); if (entry.summary && entry.type === "return") { detail.innerHTML += `<p><strong>合計:</strong> ${entry.summary}</p>`; } li.appendChild(detail); btn.addEventListener("click", () => { const open = detail.classList.toggle("open"); btn.innerHTML = entryButtonHtml(entry, open); }); } return li; } function appendEntriesToList(ul, entries) { if (!entries.length) { ul.innerHTML = '<li class="log-empty">ログ待機中…</li>'; return; } const sorted = [...entries].sort((a, b) => b.timestamp - a.timestamp); for (const entry of sorted) { ul.appendChild(renderLogEntry(entry)); } } function renderCurrentDispatchLog(party) { const root = $(`log-${party.id}`); root.innerHTML = ""; const dispatch = party.dispatches[0]; if (!dispatch) { root.innerHTML = '<p class="log-empty">まだログがありません</p>'; return; } const cap = document.createElement("p"); cap.className = "current-dispatch-label"; cap.textContent = currentDispatchLabel(dispatch); if (dispatch.status === "active") { cap.textContent += ` · ${formatClock(dispatch.endsAt)}まで`; } root.appendChild(cap); const ul = document.createElement("ul"); ul.className = "adventure-log"; appendEntriesToList(ul, dispatch.entries); root.appendChild(ul); } function renderPastDispatchLog(party) { const root = $(`past-${party.id}`); root.innerHTML = ""; const past = party.dispatches.slice(1); if (!past.length) { root.innerHTML = '<p class="log-empty">過去の派遣はありません</p>'; return; } past.forEach((dispatch, i) => { const pastIndex = i + 1; const expanded = (party.expandedDispatchIds || []).includes(dispatch.id); const group = document.createElement("div"); group.className = "dispatch-group" + (expanded ? "" : " collapsed"); const head = document.createElement("button"); head.type = "button"; head.className = "dispatch-head"; const sub = dispatch.summary ? dispatch.summary : formatClock(dispatch.endsAt) + " 帰還"; head.innerHTML = `${pastDispatchLabel(pastIndex, dispatch)}<br><span class="sub">${sub}</span>`; head.addEventListener("click", () => { if (!party.expandedDispatchIds) party.expandedDispatchIds = []; const ids = party.expandedDispatchIds; const idx = ids.indexOf(dispatch.id); if (idx >= 0) ids.splice(idx, 1); else ids.push(dispatch.id); saveGame(); renderPastDispatchLog(party); }); const body = document.createElement("div"); body.className = "dispatch-body"; const ul = document.createElement("ul"); ul.className = "adventure-log"; appendEntriesToList(ul, dispatch.entries); body.appendChild(ul); group.appendChild(head); group.appendChild(body); root.appendChild(group); }); } function renderStages() { $("stages-root").innerHTML = AREA_ORDER.map((id) => { const a = AREAS[id]; const unlocked = isAreaUnlocked(id); const clears = state.areaClears[id] || 0; let cls = "stage-chip"; if (clears > 0) cls += " cleared"; else if (unlocked) cls += " unlocked"; else cls += " locked"; const hint = unlocked ? (clears > 0 ? `クリア ${clears}回` : "解放済") : getUnlockHint(id); return `<span class="${cls}" title="${hint}">${a.name}</span>`; }).join(""); } function areaOptions(selected) { return AREA_ORDER.map((id) => { const a = AREAS[id]; const unlocked = isAreaUnlocked(id); const label = unlocked ? `${a.name}（${a.durationMs / 1000}秒）` : `${a.name}（${getUnlockHint(id)}）`; return `<option value="${id}" ${id === selected ? "selected" : ""} ${unlocked ? "" : "disabled"}>${label}</option>`; }).join(""); } function renderParties() { const root = $("parties-root"); root.innerHTML = ""; for (const party of state.parties) { const on = !!party.mission; const area = on ? getArea(party.mission.areaId) : getArea(party.selectedArea); const card = document.createElement("div"); card.className = "party-card" + (on ? " on-mission-card" : ""); card.innerHTML = ` <h3>${party.name}</h3> <div class="row"><span>${party.hero.name}</span><span class="muted">Lv.${party.hero.level}</span></div> <div class="row"> <span class="${on ? "status-mission" : "status-idle"}">${on ? `${area.name}で冒険中` : "派遣待機中"}</span> <span class="muted">XP ${party.hero.xp}/${party.hero.xpToNext}</span> </div> ${on ? `<div class="eta">${formatClock(party.mission.endsAt)} に帰還予定</div>` : ""} <label class="field-label">派遣先</label> <select class="area-select" ${on ? "disabled" : ""}>${areaOptions(party.selectedArea)}</select> <div class="dispatch-wrap" data-progress="${party.id}"> <button type="button" class="primary dispatch-btn ${on ? "on-mission" : ""}" ${on ? "disabled" : ""}> <span class="btn-progress" style="width:${on ? missionProgress(party) : 0}%"></span> <span class="btn-label">${on ? "冒険中…" : "冒険へ行く"}</span> </button> </div> `; if (!on) { card.querySelector(".area-select").addEventListener("change", (e) => { party.selectedArea = e.target.value; saveGame(); }); } card.querySelector(".dispatch-btn").addEventListener("click", () => startMission(party.id)); root.appendChild(card); } } function renderReports() { $("reports-root").innerHTML = state.parties .map((p) => { const r = p.lastReport; const body = r ? `<strong>${p.hero.name}</strong>が<strong>${r.areaName}</strong>から帰還。<br>${r.monsters} など <strong>${r.kills}</strong> 体、<strong>${r.gold}</strong> G、<strong>${r.xp}</strong> XP` + (r.levelUps?.length ? ` → Lv.<strong>${r.levelUps.at(-1)}</strong>` : "") : "まだ帰還していません"; return `<div class="sub-panel"><h3>${p.name}</h3><p class="report">${body}</p></div>`; }) .join(""); } function renderStats() { $("stats-root").innerHTML = state.parties .map((p) => { const s = p.stats; return `<div class="sub-panel"><h3>${p.name}</h3> <div class="stats"> <div class="stat-cell"><div class="label">ゴールド</div>${s.gold} G</div> <div class="stat-cell"><div class="label">討伐</div>${s.kills} 体</div> <div class="stat-cell"><div class="label">派遣</div>${s.missionsStarted} 回</div> <div class="stat-cell"><div class="label">完了</div>${s.missionsCleared} 回</div> </div></div>`; }) .join(""); } function renderAll() { state.parties.forEach(ensureValidSelectedArea); renderParties(); renderReports(); renderStages(); renderStats(); state.parties.forEach((p) => { renderCurrentDispatchLog(p); renderPastDispatchLog(p); }); } function migrate(data) { if (!data.parties) return data; for (const p of data.parties) { if (!p.stats) p.stats = defaultStats(); if (!p.dispatches) p.dispatches = []; if (!p.expandedDispatchIds) p.expandedDispatchIds = []; if (p.adventureLog?.length && !p.dispatches.length) { p.dispatches.push({ id: uid("dispatch"), areaName: "過去の記録", startedAt: 0, endsAt: 0, status: "complete", entries: p.adventureLog, summary: "移行データ", }); delete p.adventureLog; } if (p.mission && !p.mission.journal && p.mission.rewards) { const area = getArea(p.mission.areaId); p.mission.journal = buildScheduledJournal( p, area, p.mission.rewards, p.mission.startedAt, p.mission.endsAt ); const d = p.dispatches.find((x) => x.id === p.mission.dispatchId); if (d) { for (const e of p.mission.journal) { if (e.timestamp <= Date.now()) { e.shown = true; d.entries.push({ ...e }); } } } } } if (data.gold != null && data.parties[0]) { const p0 = data.parties[0].stats; p0.gold += data.gold || 0; p0.kills += data.totalKills || 0; p0.missionsStarted += data.missionsStarted || 0; p0.missionsCleared += data.missionsCleared || 0; } if (!data.areaClears) data.areaClears = {}; const inferFromDispatches = Object.keys(data.areaClears).length === 0; if (inferFromDispatches) { for (const p of data.parties) { for (const d of p.dispatches || []) { if (d.status !== "complete") continue; const areaId = d.areaId || AREA_ORDER.find((id) => AREAS[id].name === d.areaName) || "plain"; d.areaId = areaId; data.areaClears[areaId] = (data.areaClears[areaId] || 0) + 1; let prev = AREAS[areaId]?.unlockAfter; while (prev) { if (!data.areaClears[prev]) data.areaClears[prev] = 1; prev = AREAS[prev]?.unlockAfter; } } } } return data; } function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); $("save-hint").textContent = `保存済 ${formatClock(Date.now())}`; } catch { $("save-hint").textContent = "保存失敗"; } } function loadGame() { try { const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem("dispatch-hero-save-v6") || localStorage.getItem("dispatch-hero-save-v5"); if (!raw) return; const data = migrate(JSON.parse(raw)); if (data.parties) { state = { parties: data.parties, areaClears: data.areaClears || {} }; state.parties.forEach(trimDispatches); } } catch (e) { console.warn(e); } } function resetGame() { if (!confirm("セーブを消して最初からやり直しますか？")) return; ["dispatch-hero-save-v7", "dispatch-hero-save-v6", "dispatch-hero-save-v5"].forEach( (k) => localStorage.removeItem(k) ); state = { parties: [defaultParty("pt1", "アレン"), defaultParty("pt2", "リナ")], areaClears: {}, }; nextId = 1; stopTick(); saveGame(); renderAll(); } function ensureTick() { if (tickId) return; tickId = setInterval(processMissions, 250); } function stopTick() { if (tickId) { clearInterval(tickId); tickId = null; } } $("reset-btn").addEventListener("click", resetGame); document.addEventListener("visibilitychange", () => { if (!document.hidden) { processMissions(); renderParties(); updateProgressBars(); } }); loadGame(); for (const p of state.parties) { if (p.mission) { const d = p.dispatches.find((x) => x.id === p.mission.dispatchId); if (!d) { const area = getArea(p.mission.areaId); p.dispatches.unshift({ id: p.mission.dispatchId || uid("dispatch"), areaId: area.id, areaName: area.name, startedAt: p.mission.startedAt, endsAt: p.mission.endsAt, status: "active", entries: [], }); } if (!p.mission.journal && p.mission.rewards) { const area = getArea(p.mission.areaId); p.mission.journal = buildScheduledJournal( p, area, p.mission.rewards, p.mission.startedAt, p.mission.endsAt ); } revealDueEntries(p); } } processMissions(); renderAll(); if (state.parties.some((p) => p.mission)) ensureTick(); </script> </body> </html>
