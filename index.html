<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatch Hero Guild</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">Guild Dispatch Board</p>
      <h1>派遣ギルド!</h1>
    </div>
    <div class="header-actions">
      <span id="save-hint" class="save-hint">未保存</span>
      <button id="reset-btn" type="button" class="ghost">リセット</button>
    </div>
  </header>

  <main class="layout">
    <section id="party-section" class="panel">
      <div class="section-title">
        <h2>パーティ派遣</h2>
        <p>自動戦闘で記録される、ギルドの日報。</p>
      </div>
      <div id="parties-root" class="party-grid"></div>
    </section>

    <section id="logs-section" class="panel">
      <div class="section-title">
        <h2>派遣ログ</h2>
        <p>現在と過去の戦闘記録。</p>
      </div>
      <div id="logs-root" class="logs-grid"></div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>ステージ</h2>
        <p>踏破状況と次の派遣先。</p>
      </div>
      <div id="stages-root" class="stage-list"></div>
    </section>

    <section class="panel world-panel">
      <div class="section-title">
        <h2>世界情勢</h2>
        <p>討伐が進むほど、辺境の霧は晴れていく。</p>
      </div>
      <div id="world-root" class="world-root"></div>
    </section>

    <section id="storage-section" class="panel">
      <div class="section-title">
        <h2>保管庫</h2>
        <p>持ち帰った装備の控え。</p>
      </div>
      <div id="storage-root" class="storage-root"></div>
    </section>

    <section id="records-section" class="panel">
      <div class="section-title">
        <h2>記録室</h2>
        <p>装備図録</p>
      </div>
      <div id="records-root" class="records-root"></div>
    </section>

    <section class="split">
      <div id="reports-section" class="panel">
        <div class="section-title">
          <h2>帰還報告</h2>
          <p>最新の成果。</p>
        </div>
        <div id="reports-root" class="stack"></div>
      </div>

      <div class="panel">
        <div class="section-title">
          <h2>ギルド統計</h2>
          <p>パーティごとの記録。</p>
        </div>
        <div id="stats-root" class="stack"></div>
      </div>
    </section>

  </main>

  <nav class="quick-nav" aria-label="quick navigation">
    <button type="button" data-scroll-target="party-section">&#38538;</button>
    <button type="button" data-scroll-target="logs-section">&#27966;&#36963;&#12525;&#12464;</button>
    <button type="button" data-scroll-target="storage-section">&#20445;&#31649;</button>
    <button type="button" data-scroll-target="records-section">&#35352;&#37682;</button>
  </nav>

  <script src="data.js"></script>
  <script src="equip.js"></script>
  <script src="battle.js"></script>
  <script src="game.js"></script>
</body>
</html>
